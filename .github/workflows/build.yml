name: Build Desktop App

# 跨平台桌面打包：macOS(arm64 + x64) / Windows 矩阵（Linux 因构建 exit 100 已临时下线）。
# 之前「只有 macOS 成功」的根因：Windows 缺 Python/Node/Rust 统一安装、
# 缺 KRONOS_BACKEND_BUNDLE_MODE 等编译期 env。
# 本工作流对每个平台独立 setup 并产出 Tauri 安装包。
#
# 交付方式（由 PACKAGE_KIND 区分）：
#   · 任意分支 push        → 三平台构建，产物名带 -test 后缀，Artifacts 保留 7 天（测试包）
#   · main 分支 push       → 同上但产物名带 -release 后缀，保留 14 天（正式包）
#   · push v* tag          → 正式包 + release job，把安装包附到 GitHub Release

on:
  push:
    # 所有分支都构建：main 出正式包，其余分支出测试包。
    branches: ["**"]
    # tag 触发正式发布。glob 是否区分大小写官方没写，所以 v* / V* 都列上。
    # 约定仍是用小写 v（v1.1.6）；V* 只是兜底，防止又出现「打了 tag 却什么
    # 都没发生」。注意 tag 的 glob 与 release job 的 startsWith 是两处独立判断，
    # 必须都通过才会真正发布。
    tags: ["v*", "V*"]
  pull_request:
    branches: ["main", "v*", "V*"]
  workflow_dispatch:

# 同一 ref 的新推送取消旧 run，省 CI 额度。
# ⚠️ workflow 级 concurrency 不支持 matrix 上下文（会报 Unrecognized named-value: 'matrix'），
# 所以只按 ref 分组；要按平台分别取消就得把这段挪进 build job 里。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.11 has the broadest wheel coverage for PyInstaller + numeric/web deps.
  # The lite bundle does not need torch/modelscope, so keep CI on the stable lane.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable
  # main.rs 用 env! 编译期捕获这两个值，必须和打包后端一致。
  KRONOS_BACKEND_BUNDLE_MODE: lite
  KRONOS_WEB_SERVER: robyn

jobs:
  offline-checks:
    name: Offline market regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/install-lite
      - name: Install matching headless Chromium and system libraries
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Run offline acceptance checks
        run: python scripts/check_market_regressions.py

  build:
    name: Build (${{ matrix.os }})
    needs: offline-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 各平台并行；任一平台失败不取消其它。
        # macOS 两个芯片版本各出一个原生包：
        #   macos-latest   = Apple Silicon(arm64)
        #   macos-15-intel = Intel(x64)（macos-13 已退役，Intel 现用这个标签）
        # 恢复 Linux 时：把 ubuntu-latest 加回下面的 os 列表、补 include 条目，
        # 并把「Install Linux system deps」步骤一起加回来。
        os: [macos-latest, macos-15-intel, windows-latest]
        include:
          # ⚠️ artifact-glob 必须是**单行、空格分隔**的字符串，不能用 `|` 块标量。
          # 它会被插值进 Collect artifacts 的 `for f in <这里>; do` —— 多行值会在
          # 脚本文本里插入换行，bash 解析到 `for f in A` 后遇到换行就认为语句结束，
          # 下一行的 pattern 变成 unexpected token，直接 syntax error 退出码 2。
          # macOS 只收 .dmg，**不收 bundle/macos/*.app**：
          #   · .app 的内容已经完整打包在 .dmg 里，再收一份等于同一份东西存两遍
          #     （实测产物 259MB，去掉 .app 可省掉约一半）；
          #   · Release 不接受目录，最终也只会附 .dmg；
          #   · 两个架构的 .app 同名（都叫 "Lumo Trade.app"），上传/下载时靠
          #     merge-multiple 合并会互相覆盖，容易混淆。
          # 需要在本地直接双击运行 .app 调试时，从 dmg 里拖出来即可。
          - os: macos-latest
            artifact-name: macOS-arm64
            tauri-build-cmd: npm run desktop:build -- --bundles app
            artifact-glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          - os: macos-15-intel
            artifact-name: macOS-x64
            tauri-build-cmd: npm run desktop:build -- --bundles app
            artifact-glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          # Windows 用 -vv 打开 tauri-bundler 的 debug 日志。
          # 原因：tauri-bundler 的 CommandExt::output_ok 在子进程失败时只报
          # "failed to run <程序>"，**丢弃 candle/light 的 stderr**。不加 -vv 就只能
          # 看到「light.exe 退出码 1」，看不到真正的 LGHT 错误码，无法定位。
          - os: windows-latest
            artifact-name: Windows
            tauri-build-cmd: npm run desktop:build -- -vv
            artifact-glob: "src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi"

    env:
      # 非 main、非 tag 的分支推送 = 测试包；main / v* tag = 正式包。
      # PR 事件 ref_name 是 "<n>/merge"，同样落进 test。
      PACKAGE_KIND: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && 'release' || 'test' }}
      ARTIFACT_RETENTION: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && '14' || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-lite
      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Install npm deps
        run: npm ci

      # 源码保护：打包前压缩混淆前端静态资源（.js/.css）。
      - name: Minify frontend static assets
        run: bash packaging/scripts/minify_static.sh
        shell: bash

      # 构建内置后端（PyInstaller 单体，lite 模式不含 torch）。
      - name: Build bundled backend
        run: python packaging/scripts/build_backend.py --clean --mode lite
        shell: bash
        env:
          KRONOS_BACKEND_BUNDLE_MODE: lite
          KRONOS_WEB_SERVER: robyn

      # WiX Toolset v3 的 light.exe 依赖 Windows 的 VBSCRIPT 可选功能，
      # 缺失时的报错正是「failed to run light.exe」（Tauri 官方文档明确记载）。
      # windows-latest 已迁移到 Windows Server 2025，VBSCRIPT 在 24H2/Server 2025 起
      # 变成「按需功能(Feature on Demand)」，镜像可能未预装，所以显式检查并补齐。
      # 仅 Windows 需要；VBSCRIPT 已是 Installed 时本步骤为空操作，不影响 macOS。
      - name: Ensure VBSCRIPT for WiX light.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cap = Get-WindowsCapability -Online -Name 'VBScript*' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          $state = if ($cap) { $cap.State } else { '<not found>' }
          Write-Host "VBScript capability state: $state"

          if ($state -ne 'Installed') {
            Write-Host 'VBScript missing -> installing optional feature ...'
            try {
              Add-WindowsCapability -Online -Name 'VBScript~~~~0.0.1.0' -ErrorAction Stop | Out-Null
              Write-Host 'Add-WindowsCapability succeeded.'
            } catch {
              Write-Warning "Add-WindowsCapability failed: $($_.Exception.Message)"
              Write-Host 'Retrying with DISM ...'
              dism.exe /Online /Add-Capability /CapabilityName:VBScript~~~~0.0.1.0 /Quiet /NoRestart
            }
          }

          # 自检：能真的跑通一段 VBScript 才算可用（light.exe 依赖的正是这个引擎）。
          $probe = Join-Path $env:RUNNER_TEMP 'vbscript_probe.vbs'
          Set-Content -Path $probe -Value 'WScript.Echo "vbscript-ok"' -Encoding Ascii
          $out = & "$env:SystemRoot\System32\cscript.exe" //nologo $probe 2>&1
          $code = $LASTEXITCODE
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          Write-Host "cscript probe exit=$code output=$out"
          if ($code -ne 0 -or "$out" -notmatch 'vbscript-ok') {
            Write-Warning 'VBScript engine still unavailable; MSI (light.exe) will likely fail.'
          }

      # Tauri 桌面构建；main.rs 的 env! 读上面的 KRONOS_* 环境变量。
      - name: Build Tauri app
        run: ${{ matrix.tauri-build-cmd }}
        shell: bash
        env:
          KRONOS_BACKEND_BUNDLE_MODE: lite
          KRONOS_WEB_SERVER: robyn
          # CI 环境无签名凭证，跳过 macOS 公证（仅打 ad-hoc 包）。
          # 注意：必须是 "-"（ad-hoc 签名，无需任何证书）；"" 会被当作真实 identity 名，
          # codesign 报 "no identity found" 导致 bundle 失败。
          APPLE_SIGNING_IDENTITY: "-"

      - name: Create macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_dir=src-tauri/target/release/bundle
          bash packaging/scripts/build_macos_dmg.sh "$bundle_dir/macos/Lumo Trade.app" "$bundle_dir/dmg"

      # 失败时把 WiX 中间产物留档：生成的 main.wxs 能直接看出是资源/组件渲染问题，
      # 还是环境问题（VBScript/ICE）。仅 Windows 产出 WiX 文件。
      - name: Upload WiX diagnostics on failure
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Windows-wix-diagnostics
          path: |
            src-tauri/target/release/wix/**/*.wxs
            src-tauri/target/release/wix/**/*.wxl
            src-tauri/target/release/wix/**/*.wixobj
          if-no-files-found: warn
          retention-days: 7

      # 把 glob 命中的产物拷到 artifacts/ 顶层。
      #
      # ⚠️ 这段踩过两次坑，改之前先读完：
      #
      # 坑 1（原版写法，产物永远为 0）：
      #   bash -c 'cp -v ${{ matrix.artifact-glob }} artifacts/ 2>/dev/null || true'
      #   artifact-glob 当时是 `|` 块标量，插值后的换行被 bash 当命令分隔符，拆成
      #     cp -v <glob1>                     ← 缺目标文件，报错
      #     <glob2> artifacts/ 2>/dev/null    ← 把安装包路径当命令执行，报错
      #   再被 `|| true` 吞掉 → 步骤显示成功、artifacts/ 却是空的。
      #
      # 坑 2（改成 for 循环后仍炸）：
      #   for f in ${{ matrix.artifact-glob }}; do
      #   多行值在**脚本文本**里插入换行，bash 解析到 `for f in A` 后遇换行即认为语句
      #   结束，下一行 pattern 变成 unexpected token → syntax error，退出码 2。
      #   注意：变量里的换行是合法的（word splitting 会切），脚本文本里的不是。
      #
      # 所以现在双保险：
      #   1) matrix.artifact-glob 写成**单行空格分隔**字符串；
      #   2) 这里再用 tr 把任何换行折成空格，即使有人改回块标量也不会炸。
      # 另外 .app 是目录，cp 必须带 -R。
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          patterns=$(printf '%s\n' "${{ matrix.artifact-glob }}" | tr '\n' ' ')
          echo "patterns: $patterns"
          for f in $patterns; do
            if [ -d "$f" ]; then
              cp -Rv "$f" artifacts/
            elif [ -f "$f" ]; then
              cp -v "$f" artifacts/
            fi
          done
          echo '--- artifacts/ 内容 ---'
          ls -la artifacts/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-${{ matrix.artifact-name }}-${{ env.PACKAGE_KIND }}
          path: artifacts/*
          # 用 error 而不是 warn：构建成功却收不到任何产物就是「假绿」，
          # 必须让 job 红掉，否则会像以前那样一路绿灯却打不出安装包。
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION }}

  # 仅在 push v* tag 时运行：把三平台安装包附到 GitHub Release。
  # 测试包（非 main 分支）不会进入这里，只留在 Actions Artifacts。
  #
  # 关于 tag 前缀的大小写（曾误判，记下来免得再绕）：
  #   · startsWith() 官方文档明确写着 "This function is not case sensitive"，
  #     所以这里的 'refs/tags/v' 其实同时匹配 v1.0.0 和 V1.0.0，不必写两遍。
  #   · 仓库里那个 V1.0.0 tag 之所以从未产出 Release，**不是**大小写问题，
  #     而是它指向 2025-10-31 的提交，那个提交里根本还没有本 workflow 文件
  #     （git cat-file a9e6809:.github/workflows/build.yml → Not a valid object）。
  #   · 真正会拦人的是 on.push.tags 的 glob（"v*"）：它的匹配规则官方没写
  #     是否区分大小写，所以在 on.push.tags 里 v* 和 V* 都列了，双保险。
  # 约定：打 tag 用**小写 v + 版本号**，如 v1.1.6，与 package.json 版本一致。
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected files
        run: ls -la dist

      # 只附文件：.app 是目录（Release 不接受），其内容已包含在 .dmg 里。
      # fail_on_unmatched_files 保持默认 false —— 某个平台没产出该格式不应让发布失败。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
